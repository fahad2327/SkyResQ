<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rotor arms -->
  <line x1="14" y1="14" x2="50" y2="50" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="14" y1="50" x2="50" y2="14" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <!-- Rotors -->
  <circle cx="14" cy="14" r="9" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
  <circle cx="50" cy="14" r="9" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
  <circle cx="14" cy="50" r="9" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
  <circle cx="50" cy="50" r="9" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
  <!-- Motor Hubs -->
  <circle cx="14" cy="14" r="3" fill="#ffffff" />
  <circle cx="50" cy="14" r="3" fill="#ffffff" />
  <circle cx="14" cy="50" r="3" fill="#ffffff" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  <!-- Main Drone Body -->
  <rect x="24" y="24" width="16" height="16" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" />
  <!-- Gimbal / Camera indicator (forward pointing) -->
  <polygon points="32,18 27,24 37,24" fill="#00f0ff" />
  <!-- Center Status LED -->
  <circle cx="32" cy="32" r="3" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
